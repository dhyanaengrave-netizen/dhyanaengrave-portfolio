<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>3D Models | Dhyana Engrave</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f2eb;
      color: #4a281b;
    }

    .models-section {
      max-width: 1400px;
      margin: auto;
      padding: 60px 30px;
    }

    .models-section h1 {
      text-align: center;
      font-size: 48px;
      margin: 0 0 10px;
    }

    .subtitle {
      text-align: center;
      font-size: 18px;
      margin: 0 0 50px;
    }

    /* GRID */
    .models-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 25px;
      align-items: stretch;
    }

    /* CARD */
    .model-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 15px rgba(0, 0, 0, 0.10);

      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* VIEWER */
    .viewer,
    .model-placeholder {
      width: 100%;
      height: 420px;
      min-height: 420px;
      flex: 0 0 420px;

      background: #eeeeea;
      position: relative;
    }

    .viewer {
      cursor: pointer;
    }

    .viewer canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .model-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #aaa;
      font-size: 15px;
    }

    /* LOADING */
    .loading {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #777;
      font-size: 14px;

      pointer-events: none;
      z-index: 2;
    }

    /* MODEL INFO */
    .model-info {
      height: 100px;
      min-height: 100px;
      padding: 15px 18px;

      background: white;

      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .model-info h2 {
      margin: 0 0 6px;
      font-size: 21px;
    }

    .model-info p {
      margin: 0;
      color: #777;
      font-size: 14px;
      line-height: 1.4;
    }

    /* FULLSCREEN */
    .viewer:fullscreen {
      width: 100vw !important;
      height: 100vh !important;
      min-height: 100vh !important;
      max-height: none !important;

      flex: none !important;
      background: #eeeeea;
      display: block;
    }

    .viewer:fullscreen canvas {
      width: 100vw !important;
      height: 100vh !important;
      display: block;
    }

    /* RESPONSIVE */
    @media (max-width: 1000px) {
      .models-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .models-section {
        padding: 40px 20px;
      }

      .models-section h1 {
        font-size: 38px;
      }

      .models-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>


<body>

<section class="models-section">

  <h1>3D Models</h1>

  <p class="subtitle">
    Explore our CNC-ready 3D model collection
  </p>

  <div class="models-grid" id="modelsGrid"></div>

</section>


<!-- THREE.JS IMPORT MAP -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>


<script type="module">

import * as THREE from 'three';

import {
  OrbitControls
} from 'three/addons/controls/OrbitControls.js';

import {
  GLTFLoader
} from 'three/addons/loaders/GLTFLoader.js';

import {
  MeshoptDecoder
} from 'three/addons/libs/meshopt_decoder.module.js';


/* ==================================================
   MODEL LIST
================================================== */

const models = [

  {
    file: "./3D%20Model/1%20hanumaan-web.glb",
    name: "Hanuman 3D Sculpture",
    detail: "Detailed CNC Ready Religious 3D Model",
    view: "front"
  },

  {
    file: "./3D%20Model/2%20Aadiyogi-web.glb",
    name: "Adiyogi Shiva 3D Model",
    detail: "CNC Ready Spiritual Sculpture Design",
    view: "top"
  },

  {
    file: "./3D%20Model/3%20Dwarpal-web.glb",
    name: "Dwarpal 3D Model",
    detail: "Traditional Guardian CNC Sculpture Design",
    view: "front"
  },

  {
    file: "./3D%20Model/4%20Toran-web.glb",
    name: "Decorative Toran 3D Model",
    detail: "Ornamental CNC Ready Entrance Design",
    view: "top"
  },

  {
    file: "./3D%20Model/5%20Trishul-web.glb",
    name: "Trishul 3D Model",
    detail: "Detailed CNC Ready Trident Design",
    view: "top"
  },

  {
    file: "./3D%20Model/6%20Todi-web.glb",
    name: "Todi 3D Model",
    detail: "Decorative CNC Ready 3D Design",
    view: "top"
  },

  {
    file: "./3D%20Model/7%20Jewalary-web.glb",
    name: "Jewellery 3D Model",
    detail: "Detailed Ornamental 3D Design",
    view: "front"
  },

  {
    file: "./3D%20Model/8%20Glass-web.glb",
    name: "Decorative Glass 3D Model",
    detail: "CNC Ready Decorative 3D Design",
    view: "front"
  },

{
    file: "./3D%20Model/9%20Pillar-web.glb",
    name: "Decorative Pillar 3D Model",
    detail: "Detailed Architectural CNC Design",
    view: "front"
},

{
    file: "./3D%20Model/10%20Picock-web.glb",
    name: "Peacock 3D Model",
    detail: "Detailed Decorative CNC Ready 3D Design",
    view: "front"
}

];
/* ==================================================
   CREATE MODEL CARDS
================================================== */

const grid = document.getElementById("modelsGrid");

models.forEach(function(modelData, index) {

  const card = document.createElement("div");

  card.className = "model-card";

  card.innerHTML = `
    <div
      class="viewer"
      id="viewer-${index}"
      title="Click to view fullscreen"
    >
      <div
        class="loading"
        id="loading-${index}"
      >
        Loading 3D Model...
      </div>
    </div>

    <div class="model-info">

      <h2>
        ${modelData.name}
      </h2>

      <p>
        ${modelData.detail}
      </p>

    </div>
  `;

  grid.appendChild(card);

});


/* ==================================================
   COMING SOON CARDS 10 - 20
================================================== */

for (let i = 10; i <= 20; i++) {

  const card = document.createElement("div");

  card.className = "model-card coming-card";

  card.innerHTML = `
    <div class="model-placeholder coming-placeholder">

      <div class="coming-animation">

        <div class="coming-icon">
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="coming-text">
          COMING SOON
        </div>

        <div class="coming-line"></div>

        <div class="coming-subtext">
          NEW 3D MODEL
        </div>

      </div>

    </div>

    <div class="model-info">

      <h2>Upcoming 3D Model</h2>

      <p>New CNC Design Coming Soon</p>

    </div>
  `;

  grid.appendChild(card);
}

/* ==================================================
   ALL VIEWERS
================================================== */

const viewers = [];


/* ==================================================
   CREATE THREE.JS VIEWER
================================================== */

function createViewer(modelData, index) {

  const container =
    document.getElementById(`viewer-${index}`);

  const loadingText =
    document.getElementById(`loading-${index}`);


  /* SCENE */

  const scene =
    new THREE.Scene();

  scene.background =
    new THREE.Color(0xeeeeea);


  /* CAMERA */

  const camera =
    new THREE.PerspectiveCamera(
      35,
      container.clientWidth /
      container.clientHeight,
      0.01,
      1000
    );

  camera.position.set(
    0,
    0,
    5
  );


  /* RENDERER */

  const renderer =
    new THREE.WebGLRenderer({
      antialias: true,
      alpha: false
    });

  renderer.setPixelRatio(
    Math.min(
      window.devicePixelRatio,
      2
    )
  );

  renderer.setSize(
    container.clientWidth,
    container.clientHeight
  );

  renderer.outputColorSpace =
    THREE.SRGBColorSpace;

  container.appendChild(
    renderer.domElement
  );


  /* LIGHTS */

  const ambientLight =
    new THREE.AmbientLight(
      0xffffff,
      2.5
    );

  scene.add(
    ambientLight
  );


  const light1 =
    new THREE.DirectionalLight(
      0xffffff,
      3
    );

  light1.position.set(
    5,
    8,
    10
  );

  scene.add(
    light1
  );


  const light2 =
    new THREE.DirectionalLight(
      0xffffff,
      2
    );

  light2.position.set(
    -5,
    3,
    5
  );

  scene.add(
    light2
  );


  const light3 =
    new THREE.DirectionalLight(
      0xffffff,
      1.5
    );

  light3.position.set(
    0,
    -5,
    -5
  );

  scene.add(
    light3
  );


  /* CONTROLS */

  const controls =
    new OrbitControls(
      camera,
      renderer.domElement
    );

  controls.zoomToCursor = true;

  controls.enableDamping = true;

  controls.dampingFactor = 0.08;

  controls.enableRotate = true;

  controls.enableZoom = true;

  controls.enablePan = true;


  /* GLTF LOADER */

  const loader =
    new GLTFLoader();

  loader.setMeshoptDecoder(
    MeshoptDecoder
  );


 /* LOAD MODEL */

loader.load(

  modelData.file,

  /* SUCCESS */

  function(gltf) {

    const model = gltf.scene;


/* =========================================
   FIX WRONG MODEL ORIENTATION
========================================= */

/* AADIYOGI + TORAN */
if (
  modelData.name === "Adiyogi Shiva 3D Model" ||
  modelData.name === "Decorative Toran 3D Model"
) {
  model.rotation.x = Math.PI / 2;
}


/* TRISHUL */
if (modelData.name === "Trishul 3D Model") {
  model.rotation.y = Math.PI / 2;
}


/* TODI */
if (modelData.name === "Todi 3D Model") {
  model.rotation.y = Math.PI / 2;
}
/* PEACOCK */
if (modelData.name === "Peacock 3D Model") {
    model.rotation.y = Math.PI / 2;
}


/* UPDATE */
model.updateMatrixWorld(true);

scene.add(model);
      /* MODEL SIZE */

      const box =
        new THREE.Box3()
        .setFromObject(model);

      const size =
        new THREE.Vector3();

      const center =
        new THREE.Vector3();

      box.getSize(
        size
      );

      box.getCenter(
        center
      );


      /* CENTER MODEL */

      model.position.x -=
        center.x;

      model.position.y -=
        center.y;

      model.position.z -=
        center.z;


      /* AUTO CAMERA FIT */

      const maxDimension =
        Math.max(
          size.x,
          size.y,
          size.z
        );

      const fov =
        camera.fov *
        (Math.PI / 180);

      let cameraDistance =
        Math.abs(
          maxDimension /
          Math.sin(
            fov / 2
          )
        );

      cameraDistance *=
        0.75;


      camera.position.set(
        0,
        0,
        cameraDistance
      );


      camera.near =
        Math.max(
          cameraDistance / 100,
          0.001
        );

      camera.far =
        cameraDistance * 100;

      camera.updateProjectionMatrix();


      /* CONTROLS TARGET */

      controls.target.set(
        0,
        0,
        0
      );

      controls.minDistance =
        cameraDistance * 0.20;

      controls.maxDistance =
        cameraDistance * 5;

      controls.update();


      loadingText.style.display =
        "none";

    },


    /* LOADING */

    function(xhr) {

      if (xhr.total) {

        const percent =
          Math.round(
            (xhr.loaded /
             xhr.total) *
             100
          );

        loadingText.textContent =
          "Loading 3D Model... " +
          percent +
          "%";
      }

    },


    /* ERROR */

    function(error) {

      console.error(
        "3D Model Load Error:",
        modelData.file,
        error
      );

      loadingText.textContent =
        "3D Model could not be loaded";

    }

  );


  /* ==================================================
     CLICK FULLSCREEN
  ================================================== */

  let pointerMoved = false;

  let startX = 0;

  let startY = 0;


  renderer.domElement.addEventListener(
    "pointerdown",
    function(event) {

      pointerMoved = false;

      startX =
        event.clientX;

      startY =
        event.clientY;

    }
  );


  renderer.domElement.addEventListener(
    "pointermove",
    function(event) {

      const distance =
        Math.abs(
          event.clientX -
          startX
        ) +
        Math.abs(
          event.clientY -
          startY
        );

      if (distance > 5) {

        pointerMoved = true;

      }

    }
  );


  renderer.domElement.addEventListener(
    "pointerup",
    async function() {

      /* User rotated model */
      if (pointerMoved) {
        return;
      }

      /* Already fullscreen */
      if (document.fullscreenElement) {
        return;
      }

      try {

        await container.requestFullscreen();

      }

      catch(error) {

        console.error(
          "Fullscreen error:",
          error
        );

      }

    }
  );


  /* ==================================================
     RESIZE
  ================================================== */

  function resizeViewer() {

    const width =
      container.clientWidth;

    const height =
      container.clientHeight;

    if (
      width === 0 ||
      height === 0
    ) {
      return;
    }

    camera.aspect =
      width / height;

    camera.updateProjectionMatrix();

    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio,
        2
      )
    );

    renderer.setSize(
      width,
      height,
      false
    );

  }


  /* STORE VIEWER */

  viewers.push({
    container,
    scene,
    camera,
    renderer,
    controls,
    resizeViewer
  });


  /* ANIMATION */

  function animate() {

    requestAnimationFrame(
      animate
    );

    controls.update();

    renderer.render(
      scene,
      camera
    );

  }

  animate();

}


/* ==================================================
   START ALL 9 MODELS
================================================== */

models.forEach(function(modelData, index) {

  createViewer(
    modelData,
    index
  );

});


/* ==================================================
   NORMAL WINDOW RESIZE
================================================== */

window.addEventListener(
  "resize",
  function() {

    viewers.forEach(
      function(viewer) {

        viewer.resizeViewer();

      }
    );

  }
);


/* ==================================================
   FULLSCREEN RESIZE
================================================== */

document.addEventListener(
  "fullscreenchange",
  function() {

    setTimeout(
      function() {

        viewers.forEach(
          function(viewer) {

            viewer.resizeViewer();

          }
        );

      },
      100
    );

  }
);

</script>

</body>
</html>
