<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Your Project | Dhyana Engrave</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<section class="contact-page">

    <div class="contact-small-title">
        <p>Contact</p>
    </div>

    <div class="contact-heading">
        <h1>
            Let's create something<br>
            exceptional together
        </h1>

        <p>
            Tell us about your CNC project and we'll get back to you
            with the best design solution.
        </p>
    </div>


    <div class="contact-main">

        <!-- LEFT IMAGE -->
        <div class="contact-image">
           <div class="contact-logo-area">
    <img src="Dhyana Engrave Logo.webp" alt="Dhyana Engrave Logo">
</div>
        </div>


        <!-- RIGHT FORM -->
        <form
  <form
    class="project-form"
    action="https://formsubmit.co/Dhyanaengrave@gmail.com"
    method="POST"
    enctype="multipart/form-data"
>
>
 <input type="hidden" name="_subject" value="New CNC Project Inquiry - Dhyana Engrave">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_template" value="table">

    <label>First name *</label>
    <input type="text" name="first-name" required>

    <label>Last name *</label>
    <input type="text" name="last-name" required>

    <label>Email *</label>
    <input type="email" name="email" required>

            <label>First name *</label>
            <input type="text" name="first-name" required>

            <label>Last name *</label>
            <input type="text" name="last-name" required>

            <label>Email *</label>
            <input type="email" name="email" required>

            <label>WhatsApp / Phone</label>
            <input type="tel" name="phone">

            <label>Project type</label>

            <select name="project-type">
                <option value="">Select project type</option>
                <option>3D Relief Design</option>
                <option>2D CNC Design</option>
                <option>ZBrush Sculpting</option>
                <option>Architectural CNC Design</option>
                <option>Rotary CNC Design</option>
                <option>Custom CNC Design</option>
            </select>


            <label>Required File Format</label>

            <select name="file-format">
                <option value="">Select file format</option>
                <option>.STL</option>
                <option>.OBJ</option>
                <option>.DXF</option>
                <option>.DWG</option>
                <option>.EPS</option>
                <option>.RLF</option>
                <option>.TAP</option>
                <option>Other</option>
            </select>
<label>Reference Photo / File</label>

<input
    type="file"
    name="reference-file"
    accept=".jpg,.jpeg,.png,.webp,.pdf"
>

            <label>Project Size</label>

            <div class="project-size">
                <input type="text" placeholder="Width">
                <input type="text" placeholder="Height">
                <input type="text" placeholder="Depth">
            </div>
<label>Material</label>

<select name="material">
    <option value="">Select material</option>
    <option>Wood</option>
    <option>MDF</option>
    <option>Stone</option>
    <option>Marble</option>
    <option>Granite</option>
    <option>Corian</option>
    <option>Acrylic</option>
    <option>Metal</option>
    <option>Foam</option>
    <option>Other</option>
</select>

            <label>Tell us about your project</label>

            <textarea
                name="message"
                placeholder="Describe your design, material, dimensions and other requirements..."
            ></textarea>


            <button type="submit">
                Submit Project
            </button>

        </form>

    </div>

</section>

</body>
</html>
