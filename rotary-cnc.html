    <style>

        /* ================= FULL SCREEN IMAGE ================= */

        .image-lightbox {
            display: none;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 99999;
            align-items: center;
            justify-content: center;
            padding: 25px;
            box-sizing: border-box;
        }

        .image-lightbox.active {
            display: flex;
        }

        .image-lightbox img {
            width: auto !important;
            height: auto !important;
            max-width: 95vw !important;
            max-height: 92vh !important;
            object-fit: contain !important;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #ffffff;
            font-size: 50px;
            font-family: Arial, sans-serif;
            line-height: 1;
            cursor: pointer;
            z-index: 100000;
        }

        .service-gallery-card img {
            cursor: zoom-in;
        }

        @media (max-width: 750px) {

            .image-lightbox {
                padding: 15px;
            }

            .image-lightbox img {
                max-width: 95vw !important;
                max-height: 90vh !important;
            }

            .lightbox-close {
                top: 15px;
                right: 20px;
                font-size: 45px;
            }
        }

    </style>

    <!-- ================= FULL SCREEN IMAGE ================= -->

    <div class="image-lightbox" id="imageLightbox">

        <span
            class="lightbox-close"
            id="lightboxClose"
        >
            &times;
        </span>

        <img
            id="fullscreenImage"
            src=""
            alt="Full Screen Design"
        >

    </div>


    <!-- ================= LIGHTBOX SCRIPT ================= -->

    <script>

        const galleryImages =
            document.querySelectorAll(".service-gallery-card img");

        const imageLightbox =
            document.getElementById("imageLightbox");

        const fullscreenImage =
            document.getElementById("fullscreenImage");

        const lightboxClose =
            document.getElementById("lightboxClose");


        /* OPEN IMAGE */

        galleryImages.forEach(function(image) {

            image.addEventListener("click", function() {

                fullscreenImage.src = this.src;

                fullscreenImage.alt = this.alt;

                imageLightbox.classList.add("active");

                document.body.style.overflow = "hidden";

            });

        });


        /* CLOSE BUTTON */

        lightboxClose.addEventListener("click", function(event) {

            event.stopPropagation();

            imageLightbox.classList.remove("active");

            document.body.style.overflow = "";

        });


        /* BLACK BACKGROUND CLICK */

        imageLightbox.addEventListener("click", function(event) {

            if (event.target === imageLightbox) {

                imageLightbox.classList.remove("active");

                document.body.style.overflow = "";

            }

        });


        /* ESC KEY */

        document.addEventListener("keydown", function(event) {

            if (
                event.key === "Escape" &&
                imageLightbox.classList.contains("active")
            ) {

                imageLightbox.classList.remove("active");

                document.body.style.overflow = "";

            }

        });

    </script>
